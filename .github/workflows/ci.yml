name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    name: macOS build and test
    runs-on: macos-latest
    # A hung test must fail with its log, not sit until GitHub's six-hour limit.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build
      # The suite takes about a minute here; a step killed at this limit keeps
      # its log, which names the last test that started. XCTest writes its
      # progress to stdout, block-buffered into a pipe, so without unbuffered
      # output the log lags the hang by a buffer's worth of tests.
      # The runner's virtual GPU and media engine stall about one run in four in a
      # state the runner cannot kill, so the tests that need Metal or a video
      # encoder and decoder skip here and run on the self-hosted bench Mac.
      - run: swift test
        timeout-minutes: 12
        env:
          NSUnbufferedIO: "YES"
          O_HOSTED_RUNNER: "1"
      # Spec 10 §2 — the operator app's shell. The gate is `swift test` above,
      # which builds and tests the app's code as package targets; this step
      # only keeps the shell from rotting: the hand-written project file
      # reads, the app builds around those targets, and the bundle with the
      # engine embedded (the debug build already in .build) verifies as
      # signed. Nothing is run and no UI test is: those need a screen.
      - name: Build Project O.app
        timeout-minutes: 15
        run: |
          plutil -lint app/ProjectO.xcodeproj/project.pbxproj
          xcodebuild -project app/ProjectO.xcodeproj -scheme "Project O" -configuration Debug \
            -derivedDataPath .build/xcode OENGINE_CONFIGURATION=debug build
          APP=".build/xcode/Build/Products/Debug/Project O.app"
          test -x "$APP/Contents/Helpers/oengine"
          test -d "$APP/Contents/Resources/ProjectO_OEngine.bundle"
          codesign --verify --deep --strict --verbose=2 "$APP"

  # OCore must build and test with no Apple framework in it. A Linux toolchain
  # is the strongest proof: if anything Apple-only creeps in, this job fails.
  linux-portability:
    name: Linux portability (OCore)
    runs-on: ubuntu-latest
    container: swift:6.1
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build
      - run: swift test
