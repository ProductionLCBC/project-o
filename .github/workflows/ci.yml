name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  macos:
    name: macOS build and test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build
      - run: swift test

  # OCore must build and test with no Apple framework in it. A Linux toolchain
  # is the strongest proof: if anything Apple-only creeps in, this job fails.
  linux-portability:
    name: Linux portability (OCore)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build
      - run: swift test
