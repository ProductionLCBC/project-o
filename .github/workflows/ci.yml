name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    name: macOS build and test
    runs-on: macos-latest
    # A hung test must fail with its log, not sit until GitHub's six-hour limit.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build
      # The suite takes about a minute here; a step killed at this limit keeps
      # its log, which names the last test that started. XCTest writes its
      # progress to stdout, block-buffered into a pipe, so without unbuffered
      # output the log lags the hang by a buffer's worth of tests.
      - run: swift test
        timeout-minutes: 12
        env:
          NSUnbufferedIO: "YES"

  # OCore must build and test with no Apple framework in it. A Linux toolchain
  # is the strongest proof: if anything Apple-only creeps in, this job fails.
  linux-portability:
    name: Linux portability (OCore)
    runs-on: ubuntu-latest
    container: swift:6.1
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build
      - run: swift test
